<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>You are offline | HallDesk</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
        :root { --brand: #d16806; --brand-dark: #964a06; --cream: #f9f6f3; --ink: #2b2622; --muted: #7a716a; }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
            background: var(--cream); color: var(--ink);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        main { max-width: 360px; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 18px; }
        h1 { margin: 24px 0 8px; font-size: 24px; font-weight: 600; }
        p { margin: 0; color: var(--muted); line-height: 1.6; }
        button {
            margin-top: 28px; width: 100%; padding: 14px 20px; border: 0; border-radius: 999px;
            background: var(--brand); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
        }
        button:hover { background: var(--brand-dark); }
    </style>
</head>
<body>
<main>
    <img src="/icons/icon-192.png" alt="HallDesk">
    <h1>You are offline</h1>
    <p>HallDesk needs the internet to show your seat, meals and bills. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
    // Reload on its own as soon as the connection comes back
    window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
